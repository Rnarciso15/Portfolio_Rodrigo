<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bootstrap Icons - DEFINITIVO</title>
    
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #0B0E14;
            color: white;
        }
        
        .test-section {
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 10px;
        }
        
        h2 {
            color: #EC4899;
            margin-bottom: 20px;
        }
        
        /* EXATAMENTE IGUAL AO SEU PORTFOLIO */
        .title-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4F46E5, #7C3AED, #EC4899);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            margin: 10px;
        }

        .title-icon i {
            font-size: 1.75rem;
            color: white;
        }
        
        .icon-test {
            font-size: 3rem;
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>?? TESTE DEFINITIVO - Bootstrap Icons</h1>
    
    <div class="test-section">
        <h2>1. Teste Básico (deve funcionar)</h2>
        <i class="bi bi-heart-fill icon-test" style="color: red;"></i>
        <i class="bi bi-star-fill icon-test" style="color: gold;"></i>
        <i class="bi bi-check-circle-fill icon-test" style="color: green;"></i>
    </div>
    
    <div class="test-section">
        <h2>2. Ícones do Portfolio (EXATAMENTE IGUAIS)</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div class="title-icon">
                <i class="bi bi-patch-check-fill"></i>
            </div>
            <div class="title-icon">
                <i class="bi bi-kanban-fill"></i>
            </div>
            <div class="title-icon">
                <i class="bi bi-person-fill"></i>
            </div>
            <div class="title-icon">
                <i class="bi bi-envelope-fill"></i>
            </div>
            <div class="title-icon">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>3. Diagnóstico (executado automaticamente)</h2>
        <div id="diagnostics" style="font-family: monospace; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 5px;">
            <p>Carregando diagnóstico...</p>
        </div>
    </div>
    
    <script>
        // Executar diagnóstico automaticamente
        setTimeout(() => {
            const diagnosticsDiv = document.getElementById('diagnostics');
            let html = '<strong>?? RESULTADOS DO DIAGNÓSTICO:</strong><br><br>';
            
            // 1. Verificar se font está carregado
            const fontLoaded = document.fonts.check('1rem bootstrap-icons');
            html += `? Font Bootstrap Icons carregado: <span style="color: ${fontLoaded ? 'lime' : 'red'}">${fontLoaded ? 'SIM ?' : 'NÃO ?'}</span><br>`;
            
            // 2. Total de fonts
            html += `? Total de fonts carregadas: ${document.fonts.size}<br>`;
            
            // 3. Verificar CSS do primeiro ícone
            const firstIcon = document.querySelector('.title-icon i');
            if (firstIcon) {
                const styles = window.getComputedStyle(firstIcon, '::before');
                html += `<br><strong>CSS do ícone .title-icon i::before:</strong><br>`;
                html += `&nbsp;&nbsp;font-family: <span style="color: cyan">"${styles.fontFamily}"</span><br>`;
                html += `&nbsp;&nbsp;content: <span style="color: cyan">"${styles.content}"</span><br>`;
                html += `&nbsp;&nbsp;display: <span style="color: cyan">"${styles.display}"</span><br>`;
                html += `&nbsp;&nbsp;font-size: <span style="color: cyan">"${styles.fontSize}"</span><br>`;
            }
            
            // 4. Verificar se o CSS está carregado
            const links = document.querySelectorAll('link[rel="stylesheet"]');
            html += `<br><strong>Stylesheets carregados:</strong><br>`;
            links.forEach(link => {
                const href = link.href;
                if (href.includes('bootstrap-icons')) {
                    html += `&nbsp;&nbsp;? ${href}<br>`;
                }
            });
            
            // 5. Listar todas as fonts disponíveis
            html += `<br><strong>Fonts disponíveis:</strong><br>`;
            document.fonts.forEach(font => {
                html += `&nbsp;&nbsp;• ${font.family}<br>`;
            });
            
            diagnosticsDiv.innerHTML = html;
        }, 2000);
    </script>
</body>
</html>
